
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Student | ExamPortal</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .delete-container {
            background: white;
            width: 100%;
            max-width: 480px;
            padding: 35px;
            border-radius: 13px;
            text-align: center;
            border: 1px solid #dce3ef;
            box-shadow: 0 5px 20px #18243e12;
        }

        .icon {
            font-size: 45px;
            margin-bottom: 18px;
        }

        h2 {
            color: #18243e;
            margin-bottom: 12px;
        }

        p {
            color: #718096;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 12px;
        }

        .student-name {
            color: #18243e;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 7px;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
        }

        .delete-btn {
            background: #a33b46;
            color: white;
        }

        .cancel-btn {
            background: #18243e;
            color: white;
        }

        .delete-btn:hover {
            background: #812d36;
        }

        .cancel-btn:hover {
            background: #344b78;
        }
    </style>
</head>

<body>

    <div class="delete-container">

        <div class="icon">⚠️</div>

        <h2>Delete Student</h2>

        <p>Are you sure you want to delete this student record?</p>

        <p class="student-name">{{ student.name }}</p>

        <p>This action cannot be undone.</p>

        <div class="buttons">

            <form method="POST">
                {% csrf_token %}

                <button type="submit" class="btn delete-btn">
                    Yes, Delete
                </button>
            </form>

            <a href="{% url 'viewstd' %}"
               class="btn cancel-btn">
                Cancel
            </a>

        </div>

    </div>

</body>
</html>
